name: ArenaBrasil
options:
  bundleIdPrefix: app.arenabrasil
  deploymentTarget:
    iOS: '17.0'
  developmentLanguage: en-GB
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: 1,2
    GENERATE_INFOPLIST_FILE: true
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: '1'
targets:
  ArenaBrasil:
    type: application
    platform: iOS
    sources:
    - Sources
    - WidgetShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arenabrasil.football
        INFOPLIST_KEY_CFBundleDisplayName: Arena Brasil
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.sports
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait
          UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
        CODE_SIGN_ENTITLEMENTS: Support/App.entitlements
        INFOPLIST_FILE: Support/AppInfo.plist
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
    dependencies:
    - target: ArenaBrasilWidget
      embed: true
  ArenaBrasilTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - Tests
    dependencies:
    - target: ArenaBrasil
  ArenaBrasilUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
    - UITests
    - WidgetTests/WidgetIntegrationTests.swift
    dependencies:
    - target: ArenaBrasil
  ArenaBrasilWidget:
    type: app-extension
    platform: iOS
    sources:
    - WidgetShared
    - WidgetExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.arenabrasil.football.widget
        INFOPLIST_FILE: WidgetExtension/Info.plist
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_ENTITLEMENTS: Support/Widget.entitlements
        APPLICATION_EXTENSION_API_ONLY: true
        SKIP_INSTALL: true
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_STYLE: Automatic
  ArenaBrasilWidgetTests:
    type: bundle.unit-test
    platform: iOS
    sources:
    - WidgetTests/WidgetTests.swift
    dependencies:
    - target: ArenaBrasil
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: app.arenabrasil.football.widgettests
schemes:
  ArenaBrasil:
    build:
      targets:
        ArenaBrasil: all
    test:
      targets:
      - ArenaBrasilTests
      - ArenaBrasilUITests
      - ArenaBrasilWidgetTests
